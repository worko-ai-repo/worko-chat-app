# This service name is used by Serverless Framework to create and manage AWS resources. 
service: worko-chat-api

useDotenv: true # Use dotenv to load environment variables from .env file.

provider:
  name: aws # The cloud provider
  runtime: nodejs18.x # runtime environment for your Lambda functions. 
  region: ap-south-1 # The AWS region where your resources will be deployed.
  stage: ${opt:stage, 'local'} # the default stage setting will be 'local' and when you use stage flag in command line it will be changed to that value
  memorySize: 512 # The amount of memory allocated for your Lambda functions. Default is 1024 MB.
  timeout: 10 # The timeout for your Lambda functions. Default is 6 seconds.
  environment:
    STAGE: ${self:provider.stage} # Pass the stage as an environment variable to access it in your Lambda functions.
    APP_AWS_DYNAMODB_TABLE_NAME: worko-chat

  iamRoleStatements:
    - Effect: Allow
      Action:
        - "dynamodb:DescribeTable"
        - "dynamodb:Query"
        - "dynamodb:GetItem"
        - "dynamodb:PutItem"
        - "dynamodb:UpdateItem"
        - "dynamodb:DeleteItem"
        - "dynamodb:BatchGetItem"
        - "dynamodb:BatchWriteItem"
      Resource:
        - "arn:aws:dynamodb:ap-south-1:*:table/worko"
        - "arn:aws:dynamodb:ap-south-1:*:table/worko/index/GSI1"
        - "arn:aws:dynamodb:ap-south-1:*:table/worko-chat"
        - "arn:aws:dynamodb:ap-south-1:*:table/worko-chat/index/GSI1"

plugins:
  - serverless-dotenv-plugin # This plugin loads environment variables from .env file.
  - serverless-offline # This plugin allows you to run your Serverless application locally for development and testing. It simulates AWS API Gateway and Lambda on your local machine.

package:
  individually: true # This option will allow Serverless Framework to package and deploy each function individually.

functions:
  websocketHandler: # "websocketHandler" is the name of the Lambda function which will be create on aws
    handler: dist/chat.chatHandler # "dist/chat" is the path of the handler file in dist folder after compiling from typescript to javascript AND "chatHandler" is the name of the exported function in dist/chat.js file
    events: # events that will trigger websocketHandler Lambda function
      - websocket:
          route: $connect # Triggered when a WebSocket client connects.
          authorizer:
            type: request
            arn:  "arn:aws:lambda:ap-south-1:${env:APP_AWS_ACCOUNT_ID}:function:worko-auth"
      - websocket:
          route: $disconnect # Triggered when a WebSocket client disconnects.
      - websocket:
          route: sendMessage # Custom route for sending messages.
      - websocket:
          route: getMessages # Custom route for retrieving messages.
      - websocket:
          route: $default # default route is triggered when no other route is matched.
          

  chatApiHandler: # "chatApiHandler" is the name of the Lambda function which will be create on aws
    handler: dist/app.handler # "dist/app.handler" is the path of the handler file in dist folder after compiling from typescript to javascript AND "handler" is the name of the exported function in dist/app.js file
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origin: "*"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
            allowCredentials: false
          authorizer: 
            type: request
            arn:  "arn:aws:lambda:ap-south-1:${env:APP_AWS_ACCOUNT_ID}:function:worko-auth"
